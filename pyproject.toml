[project]
name = "mcp-clickhousex"
version = "0.11.0"
description = "A read-only Model Context Protocol (MCP) server for ClickHouse: metadata discovery, parameterized queries, and execution plan analysis."
readme = "README.md"
authors = [
    { name = "Jon X", email = "alyiox@hotmail.com" }
]
requires-python = ">=3.13"
keywords = [
    "clickhouse",
    "database",
    "mcp",
    "model-context-protocol",
    "sql",
    "query",
    "metadata",
    "execution-plan",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "clickhouse-connect>=1.8.0",
    "mcp[cli]>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0",
    "anyio>=4.0",
    "ruff>=0.16",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

[project.scripts]
mcp-clickhousex = "mcp_clickhousex.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_clickhousex"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
strict_markers = true
